# Quebra RF-112 e D-114: premissa de escolha com uma opção só, que viraria default.
# Valida em todo o resto. Prova B: com duas opções em subcampos, passa.
id: fixture-setor
versao: 0.1.0
mercado: B3
nome_exibicao: "Setor de fixture"
deteccao:
  sinais_fortes:
    - regulador: FIXTURE
multiplos_bloqueados:
  - metrica: "P/L"
    severidade: alerta
    motivo: "motivo exibivel qualquer"
modelos_habilitados: [ddm]
horizonte_projecao:
  tipo: convencao_setorial
  anos: 10
  ajustavel_pelo_usuario: true
regras_duras:
  - id: R-900
    validador: validarQualquerCoisa
    mensagem: "mensagem da regra dura"
modos:
  - id: unico
    label: "Modo unico"
    precisao: alta
    inputs: [entrada]
inputs_obrigatorios:
  - campo: entrada
    onde_encontrar: "Release de resultados, secao qualquer"
premissas_do_usuario:
  - campo: base_de_fixture
    obrigatorio: true
    tipo: escolha
    subcampos: [opcao_a]
    default: null
fonte: "Fixture de teste"
