id: transmissao-energia-b3
versao: 0.8.0
mercado: B3
nome_exibicao: "Transmissão de Energia Elétrica"

deteccao:
  sinais_fortes:
    - receita_predominante: RAP
    - regulador: ANEEL
    - modalidade: contrato_de_concessao_transmissao
  sinais_fracos: [CNAE 3512-3/00, "termo 'RAP' no release de resultados"]
  exemplos: [TAEE11, TRPL4, ALUP11]
  nao_confundir_com:
    - id: geracao-energia-b3
      criterio: "receita atrelada a PLD/GSF e volume gerado, não a disponibilidade"

multiplos_bloqueados:
  - metrica: "EV/EBITDA (contábil)"
    severidade: bloqueio_total
    motivo: "EBITDA IFRS inclui margem de construção sem contrapartida em caixa"
  - metrica: "P/L"
    severidade: bloqueio_total
    motivo: "lucro contábil carrega atualização financeira do ativo de concessão"

# a ordem é alfabética e não carrega preferência (D-067)
modelos_habilitados: [ddm, fcff_por_concessao]

horizonte_projecao:
  tipo: derivado_de_fato
  origem: "data_vencimento de cada concessão"
  ajustavel_pelo_usuario: false

regras_duras:
  - id: R-001
    validador: validarPerpetuidadeZero
    mensagem: "Concessão tem vencimento definido: g na perpetuidade deve ser 0"
  - id: R-002
    validador: validarFimDeFluxoNaConcessao
    mensagem: "O fluxo de cada concessão termina na sua data de vencimento"
  - id: R-003
    validador: validarValorResidual
    mensagem: "Valor residual deve ser 0, salvo indenização de RAB não amortizada informada"

# ausência temporária: conteúdo expurgado por D-067, volta na Etapa do Conhecimento
modos: null

inputs_obrigatorios:
  - campo: concessoes
    tipo: lista
    subcampos:
      - nome
      - rap_bruta_ciclo_atual
      - indice_reajuste          # IPCA | IGPM
      - data_vencimento
      - percentual_participacao
      # subcampos percentual_reducao e a_partir_de. percentual_reducao é o que
      # se corta: "0.3" é redução de 30% da RAP a partir da data (D-078)
      - reducao_contratual
    # a fonte com a estrutura que este input pede é a DCR, e não o release. A DCR
    # foi instituída pela Resolução Normativa ANEEL 396/2010, é de adoção obrigatória
    # por concessionárias e permissionárias de transmissão e distribuição, integra a
    # Prestação Anual de Contas e vai para o site da concessionária até 30 de abril
    # do ano subsequente. Conferido contra a TAESA em 31/08/2026 (D-085)
    onde_encontrar: |
      1. Demonstrações Contábeis Regulatórias (DCR) da concessionária, e o input
         exige juntar DUAS tabelas do mesmo documento:
         a) "Linhas de Transmissão em Operação, Características Financeiras", que
            traz por concessão o nome, a Propriedade que corresponde a
            percentual_participacao, a RAP, o Ano de degrau da RAP com mes e ano,
            o Mes Base Reajuste e o Indice de Correcao
         b) a tabela de características físicas, que traz "Início Operação
            Comercial" e "Venc. da Outorga"
      2. Resolução Homologatória anual da ANEEL, para a RAP do ciclo. O ato mais
         recente pode ser Despacho e não Resolução, então buscar só por REH deixa
         de fora o ciclo corrente
      3. Formulário de Referência, seção de contratos relevantes
      Ressalva conferida: o mesmo documento tem uma tabela de projeção de RAP que
      a conferência de 31/08/2026 não conseguiu ler, por desalinhamento de colunas
      na extração, e que exige leitura da página renderizada antes de qualquer uso.
      A tabela de características financeiras, que é a que este input usa, não é
      essa, e a ressalva fica registrada porque indicar fonte sem indicar o que
      nela não foi lido vende confiança que não existe
    fallback_manual: true
  - campo: deducoes_sobre_rap
    descricao: "PIS/COFINS, P&D, TFSEE e encargos que separam RAP bruta de líquida"
    # a ponte de receita completa, com a ordem das deduções, foi conferida contra a
    # apresentação de resultados da TAESA em 31/08/2026. O release segue servindo,
    # e a DCR é a fonte com a estrutura por concessão (D-085)
    onde_encontrar: |
      1. Demonstrações Contábeis Regulatórias (DCR), demonstração de resultado
         regulatória, para a ponte entre receita bruta e líquida
      2. Release de resultados, conciliação de receita regulatória

premissas_do_usuario:
  - campo: taxa_desconto
    obrigatorio: true
    default: null
    composicao_disponivel: capm
    # ausência temporária: faixa expurgada por D-067, volta na Etapa do Conhecimento
    faixa_referencia: null
  # um valor por índice, e a engine exige exatamente os índices que aparecem em
  # concessoes.indice_reajuste. O índice é parâmetro por contrato, não constante
  # do setor, e os subcampos abaixo são os índices possíveis, não valores (D-084)
  - campo: inflacao_projetada_por_indice
    obrigatorio: true
    default: null
    subcampos: [IPCA, IGPM]
  # Não existem flags booleanas de premissa. A inclusão de indenização ou de
  # renovação é derivada da presença dos valores abaixo (RF-421, D-040).
  - campo: indenizacao_rab_estimada
    obrigatorio: false
    default: null
    ajuda: >
      Valor estimado de indenização de RAB não amortizada. Deixar vazio mantém
      o valor residual em zero, conforme a regra dura R-003.
  - campo: termos_de_renovacao
    obrigatorio: false
    default: null
    subcampos: [nova_data_vencimento, nova_rap, investimento_exigido]
    ajuda: >
      Preencher apenas se você projeta renovação. Sem termos informados, o fluxo
      encerra no vencimento contratual, que é fato do contrato.

# ausência temporária: conteúdo expurgado por D-067, volta na Etapa do Conhecimento
heuristicas_de_leitura: null

fonte: "Guia de Valuation Setorial, seção 2"
