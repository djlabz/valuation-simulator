id: bancos-b3
versao: 0.5.0
mercado: B3
nome_exibicao: "Bancos e Serviços Financeiros"

deteccao:
  sinais_fortes:
    - regulador: BACEN
    - demonstracao: "balanço em formato COSIF / IFRS bancário"
    - possui_indice_basileia: true
  sinais_fracos: [CNAE 6422, "termos 'PDD', 'NIM', 'carteira de crédito'"]
  exemplos: [ITUB4, BBAS3, BBDC4, SANB11]
  nao_confundir_com:
    - id: seguradoras-b3
      criterio: "receita de prêmios/corretagem, não de intermediação de crédito"

multiplos_bloqueados:
  - metrica: "EV/EBITDA"
    severidade: bloqueio_total
    motivo: "impossível segregar dívida líquida da matéria-prima operacional"
  - metrica: "EV/qualquer"
    severidade: bloqueio_total
    motivo: "conceito de Enterprise Value não se aplica a instituições financeiras"

# a ordem é alfabética e não carrega preferência (D-067)
modelos_habilitados: [ddm, excess_return]

# ausência temporária: bancos não deriva horizonte de fato, então o horizonte é
# premissa do usuário (RF-416, RF-419 emendado por D-067)
horizonte_projecao: null

regras_duras:
  - id: R-101
    validador: validarSemEnterpriseValue
    mensagem: "EV não é aplicável a instituições financeiras"
  - id: R-102
    validador: validarRetencaoRegulatoria
    mensagem: >
      Dividendo projetado não pode exceder o lucro menos a retenção exigida
      para sustentar o crescimento dos RWA
  - id: R-103
    validador: validarSpreadROEKe
    mensagem: "ROE e custo de capital próprio na mesma base, nominal ou real"
  - id: R-104
    validador: validarCrescimentoMenorQueKe
    mensagem: "Crescimento da perpetuidade precisa ser menor que o custo de capital próprio"

# ausência temporária: conteúdo expurgado por D-067, volta na Etapa do Conhecimento
modos: null

inputs_obrigatorios:
  - campo: patrimonio_liquido_inicial
    onde_encontrar: "Balanço Patrimonial, patrimônio líquido consolidado"
  - campo: roe_historico_3a
    onde_encontrar: "Release de resultados, série histórica de rentabilidade"
  - campo: indice_basileia_atual
    onde_encontrar: "Release de resultados, seção de capital regulatório"
  - campo: rwa_atual
    onde_encontrar: "Notas explicativas, gestão de capital"
  - campo: npl_90_e_cobertura
    onde_encontrar: "Release, qualidade da carteira de crédito"
    uso: "diagnóstico e alerta, não entra no cálculo"
  # texto do curador, escrito depois de conferir o quadro na página 1 de um ITR e de
  # um DFP reais (D-114, item 6)
  - campo: acoes_ex_tesouraria
    subcampos: [quantidade_total, quantidade_tesouraria, composicao_unit]
    onde_encontrar: |
      1. ITR ou DFP mais recente entregue à CVM, página 1, quadro Dados da Empresa /
         Composição do Capital: quantidade total no bloco Do Capital Integralizado e
         ações em tesouraria no bloco Em Tesouraria, linhas Ordinárias e
         Preferenciais. Conferir no cabeçalho do quadro se a quantidade está em
         unidades ou em mil; a data é a do encerramento do período.
      2. Para conferência: nota explicativa de Patrimônio Líquido, subitens Capital
         social e Ações em tesouraria.
      3. Composição da unit, quando a companhia tem unit: estatuto social, capítulo
         de emissão de units.

premissas_do_usuario:
  - campo: base_nominal_ou_real
    obrigatorio: true
    tipo: escolha
    subcampos: [nominal, real]
    default: null
  - campo: roe_projetado_por_ano
    obrigatorio: true
    tipo: lista_por_ano
    default: null
  - campo: roe_sustentavel_projetado
    obrigatorio: true
    default: null
  - campo: custo_capital_proprio_ke
    obrigatorio: true
    default: null
    composicao_disponivel: capm
  - campo: crescimento_rwa
    obrigatorio: true
    tipo: lista_por_ano
    default: null
    ajuda: "Define quanto lucro fica retido para capital regulatório"
  - campo: basileia_alvo
    obrigatorio: true
    tipo: lista_por_ano
    default: null
  - campo: horizonte_anos
    obrigatorio: true
    default: null
  - campo: crescimento_perpetuidade
    obrigatorio: true
    default: null

# ausência temporária: conteúdo expurgado por D-067, volta na Etapa do Conhecimento
heuristicas_de_leitura: null

fonte: "Guia de Valuation Setorial, seção 1"
